[package]
name = "refmd-bins"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "api"
path = "src/bin/api.rs"

[[bin]]
name = "refmd"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1.46", features = ["rt-multi-thread", "macros"] }
api_app = { package = "api", path = "crates/api" }
cli_app = { package = "cli", path = "crates/cli" }

[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/contracts",
    "crates/application",
    "crates/presentation",
    "crates/infrastructure",
    "crates/bootstrap",
    "crates/api",
    "crates/cli",
]
