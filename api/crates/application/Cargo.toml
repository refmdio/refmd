[package]
name = "application"
version = "0.1.0"
edition = "2024"

[features]
# Enables OpenAPI schema derives on some boundary models.
openapi = ["dep:utoipa"]

[dependencies]
domain = { path = "../domain" }

anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde", "clock"] }
futures-core = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
htmlescape = "0.3"
hmac = "0.12"
http = "1"
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
mime_guess = "2"
once_cell = "1"
password-hash = "0.5"
rand = "0.8"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
similar = "2"
thiserror = "1"
tracing = "0.1"
urlencoding = "2"
utoipa = { version = "4", features = ["axum_extras", "chrono", "uuid"], optional = true }
uuid = { version = "1", features = ["v4", "serde"] }
yrs = { version = "0.24", features = ["sync"] }
zip = { version = "0.6" }

[dev-dependencies]
tokio = { version = "1.46", features = ["rt-multi-thread", "macros"] }
