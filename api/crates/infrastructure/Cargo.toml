[package]
name = "infrastructure"
version = "0.1.0"
edition = "2024"

[dependencies]
application = { path = "../application" }
domain = { path = "../domain" }

anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde", "clock"] }
dotenvy = "0.15"
futures-core = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
git2 = { version = "0.18", default-features = true, features = ["vendored-libgit2"] }
htmlescape = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
mime_guess = "2"
notify = "6"
once_cell = "1"
rand = "0.8"
redis = { version = "0.27", features = ["tokio-comp", "aio", "streams", "script", "connection-manager"] }
regex = "1"
reqwest = { version = "0.11", features = ["json", "stream", "rustls-tls"] }
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ammonia = { version = "3" }
comrak = { version = "0.22" }
syntect = { version = "5", default-features = true }
syntect-assets = "0.23"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros"] }
tempfile = "3"
thiserror = "1"
tokio = { version = "1.46", features = ["rt-multi-thread", "macros", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2.5"
zip = { version = "0.6" }
yrs = { version = "0.24", features = ["sync"] }
yrs-warp = "0.9"

argon2 = "0.5"
password-hash = "0.5"

aes-gcm = "0.10"
aead = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1.6", features = ["derive"] }

aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"

extism = { version = "1" }

pandoc = "0.8"

base64 = "0.21"
ed25519-dalek = { version = "2", features = ["std"] }
