services:
  # Infrastructure services
  postgres:
    image: postgres:17
    container_name: refmd-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-refmd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-refmd_dev}
      POSTGRES_DB: ${POSTGRES_DB:-refmd}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-refmd}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["ha"]
    image: redis:7-alpine
    container_name: refmd-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v1.1.0
    container_name: refmd-garage
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"
      - "${GARAGE_WEB_PORT:-3902}:3902"
      - "${GARAGE_ADMIN_PORT:-3903}:3903"
    volumes:
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
      - ./docker/garage.toml:/etc/garage.toml:ro
    command: ["/garage", "server"]
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 5

  # HA mode load balancer (use --profile ha to start)
  nginx:
    profiles: ["ha"]
    image: nginx:alpine
    container_name: refmd-nginx
    network_mode: host
    volumes:
      - ./docker/nginx-lb.conf:/etc/nginx/nginx.conf:ro

  # Application services (use --profile app to start)
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: crates/server/Dockerfile
    container_name: refmd-api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-refmd}:${POSTGRES_PASSWORD:-refmd_dev}@postgres:5432/${POSTGRES_DB:-refmd}
      S3_ENDPOINT: http://garage:3900
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-refmd-files}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${SERVER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: refmd-web
    environment:
      VITE_API_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  garage_data:
  garage_meta:
  redis_data:
